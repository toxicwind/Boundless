name: Boundless CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[full,dev]"
      - name: Compile check
        run: |
          python -m compileall src/boundless web
      - name: Lint (ruff)
        run: |
          ruff check src/boundless web
      - name: Run unit tests
        env:
          BOUNDLESS_TEST: "1"
        run: |
          pytest tests/test_e2e.py -v -k "not test_index_renders and not test_settings_renders"
      - name: Smoke import
        run: |
          python -c "import sys; sys.path.insert(0,'src'); from boundless import profile_epub, split_epub_by_toc, EpubSplitter, PdfSplitter, DocxSplitter, UniversalSplitter; from boundless.cli import main, web; print('imports ok')"

  build:
    name: Build binary (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[full]"
          pip install pyinstaller
      - name: Build
        run: pyinstaller --noconfirm --clean boundless.spec
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: boundless-${{ matrix.os }}
          path: |
            dist/boundless
            dist/boundless.exe
          if-no-files-found: ignore

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
